<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='Theme_Staff.css') }}">
</head>
<body class="dashboard-body">

    <header class="dash-top-bar">
        <a href="/student/payment" style="text-decoration: none;">
            <div class="dash-logo">UOW</div>
        </a>
        <h2 class="dash-title">Staff Dashboard</h2>
        <div class="dash-nav-items">

            <a href="/logout" class="solid-btn" style="text-decoration: none;">Logout</a>
        </div>
    </header>

    <div class="dash-layout">


        <main class="dash-main-content">



            <div class="section-header" style="margin-top: 40px;">
                <h3>Created Rooms</h3>

                <div class="filter-wrapper">

                    <label for="roomSearch"
                           style="font-weight:bold; margin-right:10px;">
                        Search:
                    </label>

                    <input type="text"
                           id="roomSearch"
                           placeholder="Search room name..."
                           onkeyup="searchRooms()"
                           style="
            width:250px;
            height:42px;
            padding:0 14px;
            border:none;
            border-radius:6px;
            background:#ced4e0;
            color:#2c3549;
            font-weight:bold;
        ">

                </div>
            </div>

            <div class="card-grid" id="roomContainer" style="margin-top: 20px;">
                {% for room in rooms %}
                <div class="room-card" data-category="{{ room.category }}">
                    <img src="{{ url_for('static', filename=room.image) }}"
                         class="card-room-image">
                    <div class="card-details">
                        <h3 class="card-room-title">{{ room.name }}</h3>
                        <p class="card-room-desc">{{ room.desc }}</p>
                        <a href="/Staff_EditRoom/{{ room.room_id }}" class="solid-btn" style="text-decoration:none;">Edit</a>
                    </div>
                </div>
                {% endfor %}
            </div>
        </main>
    </div>
    <a href="/Staff_CreateRoom" class="floating-create-btn">+</a>

    <footer class="footer">
        <div class="footer-logo">UOW</div>
        <div class="footer-bottom">
            <div>Copyright 2026 University Of Wollongong.</div>
            <div class="footer-links">
                <a href="#">Feedback Form</a>
                <a href="#">Privacy Policy</a>
                <a href="#">Terms & Conditions</a>
                <a href="#">Cookie Policy</a>
                <a href="#">Contact Us</a>
            </div>
        </div>
    </footer>


    <script>
        function searchRooms() {
            const keyword = document.getElementById("roomSearch").value.toLowerCase();
            const roomCards = document.querySelectorAll(".room-card");

            roomCards.forEach(card => {
                const roomName = card.querySelector(".card-room-title").innerText.toLowerCase();

                if (roomName.includes(keyword)) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
