<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UOW - Reset Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='Theme.css') }}">
</head>
<body class="dashboard-body"> <!-- Reusing your existing background style -->

    <div class="top-bar">
        UOW Password Recovery
    </div>

    <div class="page-container">
        <div class="header-logo">
            <h1>UOW</h1>
            <p>University of<br>Wollongong</p>
        </div>

        <div class="main-content">
            <div class="login-box" style="padding-top: 30px;">
                
                <h2 style="color: #2c3549; margin-top: 0; text-align: center;">Reset Your Password</h2>
                <p style="color: #5b688c; text-align: center; margin-bottom: 25px; font-size: 14px;">
                    Enter your username below and we will send you instructions to reset your password.
                </p>

                <!-- The Reset Form -->
                <form method="POST" action="/reset_password">
                    
                    <div class="input-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    
                    <div class="action-buttons">
                        <button type="submit" style="width: 100%;">Send Reset Link</button>
                    </div>
                    
                </form>

                <!-- A helpful link to get back if they remembered their password -->
                <div style="text-align: center; margin-top: 20px;">
                    <a href="/" class="forgot-link" style="align-self: center;">Back to Login</a>
                </div>
                
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-logo">UOW</div>
        <div class="footer-bottom">
            <div>Copyright 2022 Company Name.</div>
            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms & Conditions</a>
                <a href="#">Cookie Policy</a>
                <a href="#">Contact</a>
            </div>
        </div>
    </footer>

</body>
</html>
