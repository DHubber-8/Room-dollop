{% extends "staff_dashboard.html" %}

{% block content %}
<div class="mb-8">
    <h2 class="text-3xl font-extrabold text-gray-900 mb-2">Room Creation Form</h2>
    <p class="text-lg text-gray-600">Enter the details to create a new bookable space.</p>
</div>

<div class="bg-white border border-gray-200 rounded-xl shadow-sm p-8 max-w-4xl mx-auto">
    <form method="POST" action="{{ url_for('create_room') }}" class="space-y-6">
        
        <div>
            <label for="room_name" class="block mb-2 text-sm font-medium text-gray-900">Room Name/Title</label>
            <input type="text" id="room_name" name="room_name" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="e.g., Lecture Theatre 2A" required>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="type_room" class="block mb-2 text-sm font-medium text-gray-900">Type of Room</label>
                <select id="type_room" name="type_room" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
                    <option value="lecture">Lecture Room</option>
                    <option value="lab">Computer Lab</option>
                    <option value="study">Study Room</option>
                </select>
            </div>
            
            <div>
                <label for="capacity" class="block mb-2 text-sm font-medium text-gray-900">Max Capacity (Guests)</label>
                <input type="number" id="capacity" name="capacity" min="1" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5" placeholder="50">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label for="date" class="block mb-2 text-sm font-medium text-gray-900">Date Available</label>
                <input type="date" id="date" name="date" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
            </div>
            
            <div>
                <label for="time" class="block mb-2 text-sm font-medium text-gray-900">Available Time Slot</label>
                <input type="time" id="time" name="time" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
            </div>
        </div>

        <div>
            <label for="description" class="block mb-2 text-sm font-medium text-gray-900">Description</label>
            <textarea id="description" name="description" rows="5" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500" placeholder="Enter room amenities and instructions..."></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-6 border-t border-gray-200">
            <a href="{{ url_for('staff_dashboard') }}" class="py-2.5 px-5 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100">
                Cancel
            </a>
            <button type="submit" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
                Create Room
            </button>
        </div>
    </form>
</div>
{% endblock %}
