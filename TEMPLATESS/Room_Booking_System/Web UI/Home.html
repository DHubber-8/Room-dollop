<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UOW Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='Theme.css') }}">
</head>
<body>

    <div class="top-bar">
        UOW Login
    </div>

    <div class="page-container">
        <div class="header-logo">
            <h1>UOW</h1>
            <p>University of<br>Wollongong</p>
        </div>

        <div class="main-content">
            <div class="login-box">
                <div class="role-toggle">
                    <button type="button" id="btn-student" class="active" onclick="setRole('student')">Student</button>
                    <button type="button" id="btn-staff" onclick="setRole('staff')">Staff</button>
                </div>
                
                <form method="POST" action="/">
                    <input type="hidden" id="role-input" name="role" value="student">
                    
                    <div class="input-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    
                    <div class="action-buttons">
                        <button type="button">Sign Up</button>
                        <button type="submit">Login</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-logo">UOW</div>
        <div class="footer-bottom">
            <div>Copyright 2022 Company Name.</div>
            <div class="footer-links">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms & Conditions</a>
                <a href="#">Cookie Policy</a>
                <a href="#">Contact</a>
            </div>
        </div>
    </footer>

    <script>
        function setRole(role) {
            document.getElementById('role-input').value = role;
            document.getElementById('btn-student').classList.remove('active');
            document.getElementById('btn-staff').classList.remove('active');
            document.getElementById('btn-' + role).classList.add('active');
        }
    </script>
</body>
</html>
